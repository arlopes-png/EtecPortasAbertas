                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-10 w-full">
        <div class="text-center space-y-4">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white">Contact & <span class="text-blue-400">Feedback</span></h1>
            <p class="text-slate-400 max-w-xl mx-auto text-lg">Send your message, question, or suggestion and rate our project.</p>
        </div>

        <div class="p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
            <form id="form-contato" novalidate class="space-y-6">
                <div class="space-y-2">
                    <label for="nome" class="block text-sm font-medium text-slate-300">Full Name:</label>
                    <input type="text" id="nome" name="nome" placeholder="Enter your name (3 to 67 characters)" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-medium text-slate-300">Email:</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="telefone" class="block text-sm font-medium text-slate-300">Phone (Numbers only):</label>
                        <input type="text" id="telefone" name="telefone" placeholder="12 34567890" maxlength="15" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="avaliacao" class="block text-sm font-medium text-slate-300">Website Rating (0 to 5):</label>
                    <select id="avaliacao" name="avaliacao" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                        <option value="">Select a rating...</option>
                        <option value="0">0 - Very Poor</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Fair</option>
                        <option value="3">3 - Average</option>
                        <option value="4">4 - Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label for="mensagem" class="block text-sm font-medium text-slate-300">Comment or Feedback</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Write your comment about the project..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all"></textarea>
                </div>

                <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-blue-500/25 transition-all">
                    Send Message
                </button>
            </form>

            <div id="feedback" class="mt-6 text-center font-medium text-sm hidden"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-contato');
        const feedback = document.getElementById('feedback');
        const inputNome = document.getElementById('nome');
        const inputTelefone = document.getElementById('telefone');

        // Prevents the user from typing numbers in the Name field (allows letters, accents, and spaces)
        inputNome.addEventListener('input', function() {
            this.value = this.value.replace(/[0-9]/g, ''); 
        });

        // Keeps phone behavior (numbers only)
        inputTelefone.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, ''); 
        });

        function validaEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = inputNome.value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = inputTelefone.value.trim();
            const avaliacao = document.getElementById('avaliacao').value;

            if (nome === "") {
                mostrarErro("Please enter your name.");
                return;
            }

            if (nome.length < 3 || nome.length > 67) {
                mostrarErro("The name must be between 3 and 67 characters long.");
                return;
            }

            if (email === "" || !validaEmail(email)) {
                mostrarErro("Please enter a valid email address containing '@' and '.com'.");
                return;
            }

            if (telefone === "" || telefone.length < 9 || telefone.length > 16) {
                mostrarErro("Please enter a valid phone number containing numbers only (minimum 10 digits).");
                return;
            }

            if (avaliacao === "") {
                mostrarErro("Please select a rating for the website.");
                return;
            }

            feedback.className = "mt-6 text-center font-medium text-sm text-emerald-400 p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30";
            feedback.textContent = "Message and evaluation successfully sent! Thank you for your feedback.";
            feedback.classList.remove('hidden');
            
            form.reset();
        });

        function mostrarErro(mensagem) {
            feedback.className = "mt-6 text-center font-medium text-sm text-red-400 p-3 rounded-xl bg-red-950/40 border border-red-500/30";
            feedback.textContent = mensagem;
            feedback.classList.remove('hidden');
        }
    </script>
