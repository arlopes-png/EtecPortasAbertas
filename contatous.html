<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Machine Learning Engineer</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">Machine Learning</span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
                <a href="indexus.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all">Home</a>
                <a href="sobreus.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all">About</a>
                <a href="aplicacoesus.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all">Applications</a>
                <a href="bibliografiaus.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all">Bibliography</a>
                <a href="creditosus.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all">Credits</a>
                <a href="contatous.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white shadow-md shadow-blue-600/30 transition-all">Contact</a>
                <a href="contato.html" class="p-2 rounded-lg hover:bg-slate-800/60 transition-all flex items-center" title="Switch Language to Portuguese">
                    <img src="brasil.png" alt="Portuguese" class="w-10 h-auto rounded-sm">
                    <img src="usa.png" alt="English" class="w-9 h-auto rounded-sm">
                </a>
            </nav>

            <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden text-slate-300 hover:text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-1">
            <a href="indexus.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-800">Home</a>
            <a href="sobreus.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-800">About</a>
            <a href="aplicacoesus.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-800">Applications</a>
            <a href="bibliografiaus.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-800">Bibliography</a>
            <a href="creditosus.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:bg-slate-800">Credits</a>
            <a href="contatous.html" class="block px-3 py-2 rounded-md text-base font-medium bg-blue-600 text-white">Contact</a>
            <a href="contato.html" class="p-2 rounded-lg hover:bg-slate-800/60 transition-all flex items-center" title="Switch Language to Portuguese">
                <img src="brasil.png" alt="Portuguese" class="w-10 h-auto rounded-sm">
                <img src="usa.png" alt="English" class="w-9 h-auto rounded-sm">
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-10 w-full">
        <div class="text-center space-y-4">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white">Contact & <span class="text-blue-400">Feedback</span></h1>
            <p class="text-slate-400 max-w-xl mx-auto text-lg">Send us your message, question, or suggestion, and rate our project.</p>
        </div>

        <div class="p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
            <form id="form-contato" onsubmit="validarFormulario(event)" class="space-y-6">
                <div class="space-y-2">
                    <label for="nome" class="block text-sm font-medium text-slate-300">Full Name:</label>
                    <input type="text" id="nome" name="nome" placeholder="Enter your full name" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-medium text-slate-300">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="telefone" class="block text-sm font-medium text-slate-300">Phone Number:</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(19) 99999-9999" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="avaliacao" class="block text-sm font-medium text-slate-300">Website Rating (0 to 5):</label>
                    <select id="avaliacao" name="avaliacao" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all">
                        <option value="">Select a rating...</option>
                        <option value="0">0 - Unsatisfactory</option>
                        <option value="1">1 - Fair</option>
                        <option value="2">2 - Good</option>
                        <option value="3">3 - Very Good</option>
                        <option value="4">4 - Great</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label for="mensagem" class="block text-sm font-medium text-slate-300">Comment or Feedback <span class="text-slate-500 text-xs">(Optional)</span>:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Write your comments about the project..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500 transition-all"></textarea>
                </div>

                <button type="submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-blue-500/25 transition-all">
                    Send Message
                </button>
            </form>

            <div id="feedback" class="mt-6 text-center font-medium text-sm"></div>
        </div>
    </main>

    <script>
        function validarFormulario(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const avaliacao = document.getElementById('avaliacao').value;
            const feedback = document.getElementById('feedback');

            if (!nome || !email || !telefone || !avaliacao) {
                feedback.className = "mt-6 text-center font-medium text-sm text-red-400 p-3 rounded-xl bg-red-950/40 border border-red-500/30";
                feedback.textContent = "Please fill in all required fields correctly.";
                return;
            }

            feedback.className = "mt-6 text-center font-medium text-sm text-emerald-400 p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30";
            feedback.textContent = "Message and rating submitted successfully! Thank you for your feedback.";
            document.getElementById('form-contato').reset();
        }
    </script>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-center text-slate-400 text-sm">
        <div class="max-w-7xl mx-auto px-4 space-y-2">
            <p class="font-medium text-slate-300">ETEC DE HORTOLÂNDIA 2026 – © All rights reserved</p>
            <p class="text-xs text-slate-500">Non-profit academic project</p>
        </div>
    </footer>

</body>
</html>
